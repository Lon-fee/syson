name: Build Docker Image (Local Test)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/syson/package-lock.json

      - name: Configure npm for GitHub Packages
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=$PACKAGES_TOKEN" >> ~/.npmrc
          echo "@eclipse-sirius:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "@eclipse-syson:registry=https://npm.pkg.github.com/" >> ~/.npmrc

      - name: Install frontend dependencies
        working-directory: frontend/syson
        run: npm ci

      - name: Build frontend
        working-directory: frontend/syson
        run: npm run build

      - name: Configure Maven settings
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>github-sirius-web</id>
                    <name>Sirius Web - Maven Packages</name>
                    <url>https://maven.pkg.github.com/eclipse-sirius/sirius-web</url>
                  </repository>
                  <repository>
                    <id>github-sirius-emfjson</id>
                    <name>Sirius EMF JSON - Maven Packages</name>
                    <url>https://maven.pkg.github.com/eclipse-sirius/sirius-emf-json</url>
                  </repository>
                  <repository>
                    <id>github</id>
                    <name>SysON - Maven Packages</name>
                    <url>https://maven.pkg.github.com/eclipse-syson/syson</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server>
                <id>github-sirius-web</id>
                <username>USERNAME</username>
                <password>TOKEN</password>
              </server>
              <server>
                <id>github-sirius-emfjson</id>
                <username>USERNAME</username>
                <password>TOKEN</password>
              </server>
              <server>
                <id>github</id>
                <username>USERNAME</username>
                <password>TOKEN</password>
              </server>
            </servers>
          </settings>
          EOF
          sed -i "s/USERNAME/${{ github.actor }}/g" ~/.m2/settings.xml
          sed -i "s/TOKEN/$PACKAGES_TOKEN/g" ~/.m2/settings.xml

      - name: Copy frontend build to backend resources
        run: |
          mkdir -p backend/application/syson-application/src/main/resources/static
          cp -r frontend/syson/dist/* backend/application/syson-application/src/main/resources/static/

      - name: Build with Maven
        run: mvn clean package -DskipTests -Dcheckstyle.skip -pl backend/application/syson-application -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.simple
          push: false
          tags: syson-ai:latest
          outputs: type=docker,dest=./syson-ai.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: syson-ai-docker-image
          path: ./syson-ai.tar
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: syson-application-jar
          path: backend/application/syson-application/target/syson-application-*.jar
          retention-days: 7
