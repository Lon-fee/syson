# SysON AI Services Configuration
# Configure AI services for SysML V2 modeling assistance

# Enable/disable AI services
syson.ai.enabled=true

# AI provider: gemini, openai, azure
syson.ai.provider=gemini

# API timeout in milliseconds
syson.ai.timeout=60000

# ===========================
# Google Gemini Configuration
# ===========================
# Get your API key from: https://ai.google.dev/
syson.ai.gemini.api-key=${GEMINI_API_KEY:your-api-key-here}
syson.ai.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta
syson.ai.gemini.model=gemini-2.0-flash-exp
syson.ai.gemini.temperature=0.7
syson.ai.gemini.max-output-tokens=8192
syson.ai.gemini.top-p=0.95
syson.ai.gemini.top-k=40

# ===========================
# OpenAI Configuration (Alternative)
# ===========================
syson.ai.openai.api-key=${OPENAI_API_KEY:}
syson.ai.openai.endpoint=https://api.openai.com/v1
syson.ai.openai.model=gpt-4
syson.ai.openai.temperature=0.7
syson.ai.openai.max-tokens=4096
